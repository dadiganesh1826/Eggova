# ── Dev / Local Testing ──────────────────────────────────────────────────────
server.port=3000
spring.profiles.active=dev

# H2 In-Memory Database (zero setup needed for local testing)
spring.datasource.url=jdbc:h2:mem:eggovadb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=dev_secret_key_at_least_32_characters_long_for_local
app.jwt.expiration-ms=604800000

# Firebase (graceful skip if not found in dev)
app.firebase.service-account-path=./firebase-service-account.json
app.firebase.enabled=false

# Razorpay
app.razorpay.key-id=rzp_test_placeholder
app.razorpay.key-secret=placeholder_secret
app.razorpay.webhook-secret=placeholder_webhook_secret

# Admin seed
app.admin.email=admin@eggova.com
app.admin.password=admin123

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Logging
logging.level.com.eggova=DEBUG
logging.level.org.springframework.security=WARN

