# ── Eggova Backend Configuration ─────────────────────────────────────────────
# Port: Defaults to 3000 for local dev / testing, can be overridden with PORT env var
server.port=${PORT:3000}
spring.application.name=eggova-backend

# ── Database ─────────────────────────────────────────────────────────────────
# Zero-setup fallback: if DATABASE_URL is not set, automatically uses H2 in-memory DB in PostgreSQL mode.
# When running with Docker/Production, DATABASE_URL is injected (e.g. jdbc:postgresql://postgres:5432/eggova_db).
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:eggovadb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Web Console (available at http://localhost:3000/h2-console during local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT Authentication ───────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:eggova_default_dev_secret_key_min_32_characters_long_for_security_12345}
app.jwt.expiration-ms=${JWT_EXPIRES_IN_MS:604800000}

# ── Firebase (Google Auth & FCM) ─────────────────────────────────────────────
app.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:./firebase-service-account.json}
app.firebase.enabled=${FIREBASE_ENABLED:false}

# ── Razorpay Payments ────────────────────────────────────────────────────────
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# ── Default Admin & Seeding Configuration ────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:admin@eggova.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.seed.enabled=${SEED_ENABLED:true}
app.seed.demo-customer=${SEED_DEMO_CUSTOMER:true}

# ── Scheduling ───────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2

# ── Actuator Health Endpoint ─────────────────────────────────────────────────
management.endpoints.web.base-path=/api
management.endpoint.health.show-details=never

# ── Swagger / OpenAPI Documentation ──────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.eggova=INFO
logging.level.org.springframework.security=WARN
