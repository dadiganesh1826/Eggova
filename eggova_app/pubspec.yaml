version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.4.0
  shared_preferences: ^2.2.3
  razorpay_flutter: ^1.3.7
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
